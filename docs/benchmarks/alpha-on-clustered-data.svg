<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="Alpha on clustered data: why the default is 1.0"><rect width="900" height="460" fill="#000000"/><rect x="8" y="8" width="884" height="444" rx="10" fill="#0C0C14"/><text x="26.0" y="38.0" fill="#CDD6F4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19.0" text-anchor="start" font-weight="600">Alpha on clustered data: why the default is 1.0</text><text x="26.0" y="58.0" fill="#9494B8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" text-anchor="start" font-weight="400">A larger alpha keeps more near candidates, and they take the slots the long edges between clusters needed.</text><line x1="78" y1="386.0" x2="814" y2="386.0" stroke="#26263A" stroke-width="1"/><text x="68.0" y="390.0" fill="#9494B8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" text-anchor="end" font-weight="400">0.800</text><line x1="78" y1="313.5" x2="814" y2="313.5" stroke="#26263A" stroke-width="1"/><text x="68.0" y="317.5" fill="#9494B8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" text-anchor="end" font-weight="400">0.850</text><line x1="78" y1="241.0" x2="814" y2="241.0" stroke="#26263A" stroke-width="1"/><text x="68.0" y="245.0" fill="#9494B8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" text-anchor="end" font-weight="400">0.900</text><line x1="78" y1="168.5" x2="814" y2="168.5" stroke="#26263A" stroke-width="1"/><text x="68.0" y="172.5" fill="#9494B8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" text-anchor="end" font-weight="400">0.950</text><line x1="78" y1="96.0" x2="814" y2="96.0" stroke="#26263A" stroke-width="1"/><text x="68.0" y="100.0" fill="#9494B8