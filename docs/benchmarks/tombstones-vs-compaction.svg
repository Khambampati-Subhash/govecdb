<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="What tombstones cost, and what Compact gives back"><rect width="900" height="460" fill="#000000"/><rect x="8" y="8" width="884" height="444" rx="10" fill="#0C0C14"/><text x="26.0" y="38.0" fill="#CDD6F4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19.0" text-anchor="start" font-weight="600">What tombstones cost, and what Compact gives back</text><text x="26.0" y="58.0" fill="#9494B8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" text-anchor="start" font-weight="400">Dead slots ride the frontier and keep results under-filled, so the search widens. Rebuilding returns it to a clean graph.</text><line x1="78" y1="386.0" x2="814" y2="386.0" stroke="#26263A" stroke-width="1"/><text x="68.0" y="390.0" fill="#9494B8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" text-anchor="end" font-weight="400">0µs</text><line x1="78" y1="328.0" x2="814" y2="328.0" stroke="#26263A" stroke-width="1"/><text x="68.0" y="332.0" fill="#9494B8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" text-anchor="end" font-weight="400">50µs</text><line x1="78" y1="270.0" x2="814" y2="270.0" stroke="#26263A" stroke-width="1"/><text x="68.0" y="274.0" fill="#9494B8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" text-anchor="end" font-weight="400">100µs</text><line x1="78" y1="212.0" x2="814" y2="212.0" stroke="#26263A" stroke-width="1"/><text x="68.0" y="216.0" fill="#9494B8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" text-anchor="end" font-weight="400">150µs</text><line x1="78" y1="154.0" x2="814" y2="154.0" stroke="#26263A" stroke-width="1"/><text x="68.0" y="15