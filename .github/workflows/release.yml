name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          check-latest: true

      # A tag is permanent in Go: the module proxy caches it on first fetch, so a
      # broken release cannot be quietly replaced — only superseded. Everything
      # is verified again here rather than trusted from the branch build.
      - name: verify
        run: |
          go build ./...
          go vet ./...
          go test ./... -race -timeout 40m

      - name: the tag must match a CHANGELOG entry
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no '## [${version}]' section for tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          # Everything between this version's heading and the next one.
          awk -v v="## [${version}]" '
            $0 ~ "^"v {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > /tmp/notes.md
          echo "Release notes:"
          cat /tmp/notes.md

      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --verify-tag

      # pkg.go.dev only indexes a version once someone asks for it. Asking here
      # means the documentation is live by the time anyone reads the release,
      # rather than on whoever happens to look first.
      - name: ask the module proxy to fetch it
        run: |
          module="github.com/khambampati-subhash/govecdb"
          curl -fsS "https://proxy.golang.org/${module}/@v/${GITHUB_REF_NAME}.info" \
            && echo "proxy has ${GITHUB_REF_NAME}"
