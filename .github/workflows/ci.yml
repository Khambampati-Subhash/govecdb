name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # So a dependency-free module still notices a toolchain regression rather than
  # finding out on the next push, which might be months away.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The module has no third-party dependencies and must keep it that way, so
  # nothing here should ever need the network at build time.
  GOFLAGS: -mod=readonly

jobs:
  build:
    name: build & test (go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and current. Windows is deliberately absent — see the
        # note in README's Project layout: the WAL and snapshot store fsync the
        # containing *directory*, which is not a portable operation there. It is
        # an open item rather than a silent gap.
        go: ["1.24.x", "1.25.x"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: go.mod has no dependencies
        shell: bash
        run: |
          # The zero-dependency guarantee is a design goal, so it is a test.
          if grep -qE '^\s*require' go.mod; then
            echo "::error file=go.mod::go.mod gained a require block; the module is meant to be stdlib-only"
            exit 1
          fi
          if [ -f go.sum ]; then
            echo "::error::go.sum exists; the module is meant to be stdlib-only"
            exit 1
          fi

      - run: go build ./...

      - run: go vet ./...

      - name: go test
        run: go test ./... -timeout 20m

  race:
    name: race detector (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          check-latest: true

      # The gate before merging. Generous timeout on purpose: the detector costs
      # roughly 10x, and a CI runner is slower than a developer laptop, so the
      # default 10m per package is not enough for internal/hnsw.
      #
      # The recall sweeps skip themselves under -race (they are single-goroutine,
      # so the detector observes nothing while costing the whole budget).
      # Concurrency coverage lives in the TestConcurrent* tests.
      - name: go test -race
        run: go test ./... -race -timeout 40m

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          check-latest: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      # Pinned rather than @latest: a linter that changes under you turns an
      # unrelated PR red. Run via `go run`, which does not touch go.mod, so the
      # zero-dependency guarantee survives having a linter.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          check-latest: true

      - name: go test -cover
        run: go test ./... -coverprofile=coverage.out -covermode=atomic -timeout 20m

      # Reported, not gated. A coverage threshold measures how much code a test
      # touched, not whether it checked anything, and gating on it reliably
      # produces tests written to move the number.
      - name: summarise
        run: |
          {
            echo "### Coverage"
            echo
            echo '```'
            go tool cover -func=coverage.out | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  service:
    name: the daemon actually serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          check-latest: true

      # The Go tests drive the daemon over a socket already. What this adds is
      # the part they cannot: the built binary, started the way an operator
      # starts it, and stopped the way a supervisor stops it. A daemon that
      # serves correctly and then hangs on SIGTERM passes every test in the
      # repository.
      - name: build
        run: go build -o /tmp/govecdbd ./cmd/govecdbd

      - name: serve, drive, and shut down
        run: |
          set -euo pipefail

          export GOVECDB_AUTH_TOKEN=ci-token
          auth=(-H "Authorization: Bearer ci-token" -H "Content-Type: application/json")

          /tmp/govecdbd -dir /tmp/govecdb-ci -addr 127.0.0.1:8080 &
          pid=$!
          trap 'kill -9 "$pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 100); do
            if curl -fsS localhost:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          curl -fsS localhost:8080/healthz >/dev/null

          # The health probes must answer without credentials; everything else
          # must not.
          curl -fsS localhost:8080/readyz >/dev/null
          code=$(curl -so /dev/null -w '%{http_code}' localhost:8080/v1/collections)
          test "$code" = "401" || { echo "::error::unauthenticated request got $code, want 401"; exit 1; }

          curl -fsS -X POST localhost:8080/v1/collections "${auth[@]}" \
            -d '{"name":"docs","dimension":4,"sync_policy":"never"}' >/dev/null

          curl -fsS -X POST localhost:8080/v1/collections/docs/vectors "${auth[@]}" \
            -d '{"vectors":[
                  {"id":"a","values":[1,0,0,0],"metadata":{"page":1}},
                  {"id":"b","values":[0,1,0,0],"metadata":{"page":12}}
                ]}' >/dev/null

          got=$(curl -fsS -X POST localhost:8080/v1/collections/docs/search "${auth[@]}" \
            -d '{"query":[1,0,0,0],"k":1}' | jq -r '.matches[0].id')
          test "$got" = "a" || { echo "::error::nearest neighbour was $got, want a"; exit 1; }

          got=$(curl -fsS -X POST localhost:8080/v1/collections/docs/search "${auth[@]}" \
            -d '{"query":[1,0,0,0],"k":2,"filter":{"op":"gte","key":"page","value":10}}' \
            | jq -r '.matches | length')
          test "$got" = "1" || { echo "::error::filtered search returned $got matches, want 1"; exit 1; }

          curl -fsS -X POST localhost:8080/v1/collections/docs/snapshot "${auth[@]}" >/dev/null
          curl -fsS localhost:8080/metrics "${auth[@]}" | grep -q 'govecdb_collection_live_vectors{collection="docs"} 2'

          # A supervisor sends SIGTERM and expects the process to leave cleanly.
          kill -TERM "$pid"
          for _ in $(seq 1 100); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::the daemon ignored SIGTERM"
            exit 1
          fi
          wait "$pid" || { echo "::error::the daemon exited non-zero on SIGTERM"; exit 1; }

      # And the data is still there, which is the claim a service makes that a
      # library does not have to.
      - name: restart and find the data
        run: |
          set -euo pipefail
          export GOVECDB_AUTH_TOKEN=ci-token

          /tmp/govecdbd -dir /tmp/govecdb-ci -addr 127.0.0.1:8080 &
          pid=$!
          trap 'kill -9 "$pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 100); do
            if curl -fsS localhost:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 0.1
          done

          got=$(curl -fsS localhost:8080/v1/collections/docs/vectors/a \
            -H "Authorization: Bearer ci-token" | jq -r '.metadata.page')
          test "$got" = "1" || { echo "::error::after a restart the vector came back as $got"; exit 1; }

  docker:
    name: the image builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: docker build -t govecdb:ci .

      # A FROM scratch image has no shell, so a broken entrypoint is invisible
      # until something tries to talk to it.
      - name: run
        run: |
          set -euo pipefail
          docker run -d --name govecdb-ci -p 8080:8080 \
            -e GOVECDB_AUTH_TOKEN=ci-token govecdb:ci
          trap 'docker logs govecdb-ci || true; docker rm -f govecdb-ci >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 100); do
            if curl -fsS localhost:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          curl -fsS localhost:8080/healthz >/dev/null

          curl -fsS -X POST localhost:8080/v1/collections \
            -H "Authorization: Bearer ci-token" -H "Content-Type: application/json" \
            -d '{"name":"docs","dimension":4}' >/dev/null

          # It has to write to /data as a non-root user, which is the part of the
          # image most likely to be wrong.
          got=$(curl -fsS localhost:8080/v1/collections \
            -H "Authorization: Bearer ci-token" | jq -r '.collections[0].name')
          test "$got" = "docs" || { echo "::error::the container listed $got"; exit 1; }

  examples:
    name: README quick start actually runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          check-latest: true

      # A README example that does not compile is worse than no example, and it
      # rots silently because nothing builds it. This extracts the quick start
      # from the README verbatim and runs it twice — the second run is the
      # persistence claim the README makes.
      - name: extract and run
        run: |
          set -euo pipefail
          mkdir -p /tmp/quickstart
          awk '/^A complete program\./{f=1} f&&/^```go$/{c=1;next} c&&/^```$/{exit} c{print}' \
            README.md > /tmp/quickstart/main.go
          if [ ! -s /tmp/quickstart/main.go ]; then
            echo "::error file=README.md::could not extract the quick-start program from the README"
            exit 1
          fi
          cd /tmp/quickstart
          cat > go.mod <<EOF
          module quickstart

          go 1.24

          require github.com/khambampati-subhash/govecdb v0.0.0

          replace github.com/khambampati-subhash/govecdb => $GITHUB_WORKSPACE
          EOF
          GOFLAGS= go mod tidy
          echo "--- first run"
          go run .
          echo "--- second run (data must survive)"
          go run .
